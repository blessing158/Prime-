<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime AI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header>
        <div class="logo">
            <div class="arc"></div>
            <h1>PRIME</h1>
        </div>

        <button class="menu-btn">⋮</button>
    </header>

    <div id="chat-box" class="chat-box">

        <div class="ai">
            <div class="bubble">
                Welcome back.<br>
                I am Prime AI.
            </div>
        </div>

    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Message Prime...">

        <button id="send-btn">
            ➤
        </button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
